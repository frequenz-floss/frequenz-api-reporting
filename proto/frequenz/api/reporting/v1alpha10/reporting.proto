syntax = "proto3";

package frequenz.api.reporting.v1alpha10;

import "google/protobuf/timestamp.proto";

import "frequenz/api/common/v1alpha8/types/interval.proto";
import "frequenz/api/common/v1alpha8/metrics/metrics.proto";
import "frequenz/api/common/v1alpha8/microgrid/electrical_components/electrical_components.proto";
import "frequenz/api/common/v1alpha8/microgrid/microgrid.proto";
import "frequenz/api/common/v1alpha8/microgrid/sensors/sensors.proto";

// The Reporting service provides access to historical and real-time telemetry
// data from microgrids.
//
// It exposes raw metrics originating from microgrid electrical components
// and sensors.
//
// Electrical components represent assets involved in energy conversion,
// storage, or flow within a microgrid (e.g. batteries, inverters, EV
// chargers, meters). Sensors represent auxiliary measurement devices that
// are not part of the electrical topology (e.g. temperature, irradiance,
// environmental, or external reference sensors).
//
// In addition to raw metrics, clients may optionally request server-side
// aggregation and resampling of metrics, applied deterministically to both
// historical and real-time telemetry data based on explicitly provided
// parameters.
//
// Aggregation is defined using user-provided formulas, while resampling
// allows telemetry samples to be grouped into fixed time windows.
//
// The service is designed as a general-purpose data access layer for telemetry
// analysis, notebooks, forecasting, trading, and other downstream analytics
// and optimization systems. The service is streaming-first and enables the
// replay of historical telemetry data for a requested time range, and
// may continue with real-time telemetry updates if specified.
//
// Aggregation, resampling, and filtering are all optional and performed
// server-side according to the parameters provided in the request.
//
// 1. Metrics and telemetry
//
// In the Reporting API, a metric represents a well-defined physical or
// logical quantity (e.g. voltage, active power, state of charge, temperature)
// measured at a specific point in time.
//
// Metrics originate from telemetry samples produced by microgrid electrical
// components or sensors. Each telemetry sample:
//   • has a UTC timestamp,
//   • represents exactly one metric value,
//   • may be associated with a logical connection or channel,
//   • may optionally include bounds or operational state.
//
// Aggregated metrics are derived exclusively from telemetry samples.
// No additional inference, estimation, or semantic transformation is
// performed by the Reporting API.
//
// 2. Aggregation formulas
//
// An aggregation formula defines how multiple telemetry samples for the
// same metric are combined into a single aggregated value.
//
// Aggregation formulas are optional and provided explicitly by the client.
// They are evaluated deterministically by the server and may:
//   • reference electrical component identifiers,
//   • reference sensor identifiers,
//   • use basic mathematical operators,
//   • use supported aggregation functions such as sum() or avg().
//
// Aggregation formulas operate only on telemetry samples and do not introduce
// additional inference, estimation, or business logic.
//
// 3. Resampling
//
// Resampling is an optional operation that groups telemetry samples into
// fixed, contiguous time windows and produces at most one output sample per
// window.
//
// Resampling applies uniformly to historical replay and real-time streaming
// data.
//
// When resampling is enabled by default:
//   • samples are grouped using left-closed, right-open time intervals,
//   • all samples within a window are aggregated,
//   • the resulting timestamp represents the start of the window.
//
// If no resampling resolution is specified, data is returned in its original
// resolution without modification.
//
// 4. Time windows and stream lifecycle
//
// All time filtering follows a left-closed, right-open interval convention:
//
//     [start_time, end_time)
//
// A bounded time window results in a finite stream that closes automatically
// once all matching samples have been emitted.
//
// An unbounded time window (i.e. no end_time) results in a stream that may
// continue emitting real-time samples indefinitely.
//
// 5. Data inclusion (Filtering)
//
// Some data categories (e.g. bounds, operational states) are excluded by
// default.
//
// Clients may explicitly request inclusion of this data in order to:
//   • reduce payload size when not needed,
//   • minimize server-side computation,
//   • keep high-frequency streams efficient and predictable.
//
// Unless explicitly requested, optional data MUST NOT be assumed to be
// present in responses.
//
// !!! important "Authentication"
//     All requests to the Reporting service must be signed. The key identifier
//     and signature must be included in the request metadata (gRPC metadata
//     / HTTP headers). The signature must be computed using the HMAC-SHA256
//     algorithm and secret key. All requests to this service must be made
//     over TLS (HTTPS).
//
service ReportingService {
  // Streams metrics for a list of microgrid components.
  //
  // !!! note
  //     This RPC endpoint streams metrics data for electrical components of one
  //     or more microgrids. Clients need to provide at least one microgrid
  //     ID and one electrical component ID to get a result.
  rpc ReceiveMicrogridElectricalComponentsDataStream
      (ReceiveMicrogridElectricalComponentsDataStreamRequest)
    returns (stream ReceiveMicrogridElectricalComponentsDataStreamResponse) {}

  // Streams aggregated metrics based on user-defined formulas for a list of
  // microgrid electrical components.
  //
  // !!! note
  //     This RPC endpoint retrieves aggregated historical metrics data based
  //     on user-defined formulas for microgrid electrical components. At least
  //     one formula for one microgrid must be provided for a valid result.
  rpc ReceiveAggregatedMicrogridElectricalComponentsDataStream
      (ReceiveAggregatedMicrogridElectricalComponentsDataStreamRequest)
    returns (stream ReceiveAggregatedMicrogridElectricalComponentsDataStreamResponse) {}

  // Streams metrics for a list of microgrid sensors.
  //
  // !!! note
  //     This RPC endpoint streams metrics data for sensors of one or more
  //     microgrids. Clients need to provide at least one microgrid ID and
  //     one sensor ID to get a result.
  rpc ReceiveMicrogridSensorsDataStream
      (ReceiveMicrogridSensorsDataStreamRequest)
    returns (stream ReceiveMicrogridSensorsDataStreamResponse) {}

  // Streams aggregated metrics based on user-defined formulas for a list of
  // microgrid sensors.
  //
  // !!! note
  //     This RPC endpoint retrieves aggregated historical metrics data based
  //     on user-defined formulas for microgrid sensors. At least one formula
  //     for one microgrid must be provided for a valid result.
  rpc ReceiveAggregatedMicrogridSensorsDataStream
      (ReceiveAggregatedMicrogridSensorsDataStreamRequest)
    returns (stream ReceiveAggregatedMicrogridSensorsDataStreamResponse) {}
}

// Defines whether a specific data category should be included in the response.
//
// The FilterOption enum is used in `IncludeOptions` to explicitly control
// whether optional data blocks (e.g. bounds, operational states) are emitted
// in stream responses.
//
enum FilterOption {
  // UNSPECIFIED: Default unspecified value — must not be used.
  FILTER_OPTION_UNSPECIFIED = 0;

  // EXCLUDED: Explicitly exclude the corresponding data from the response.
  FILTER_OPTION_EXCLUDE = 1;

  // INCLUDED: Explicitly include the corresponding data in the response.
  FILTER_OPTION_INCLUDE = 2;
}

// Time-filter defining the historical window and real-time behaviour of the
// stream.
//
// Semantics:
//   - If `end_time` is provided, it MUST be ≤ the current server time. The
//     server streams all samples t where start_time ≤ t < end_time and
//     then closes the stream.
//
//   - If `end_time` is omitted, the server streams all historical samples
//     t ≥ start_time (if provided) and then continues streaming new samples
//     in real time. The stream remains open indefinitely.
//
//   - If `start_time` is omitted:
//         – and `end_time` is omitted: the stream produces no historical data
//           and begins streaming real-time samples only.
//         – and `end_time` is provided: the historical window is empty and
//           the stream closes immediately.
//
// Validation rules:
//   - end_time > now() → INVALID_ARGUMENT
//
message TimeFilter {
  // Optional; Time window for matching sample interval start timestamps.
  //
  // If omitted, samples from all timestamps are included.
  frequenz.api.common.v1alpha8.types.Interval interval = 1;
}

// Resampling options for aggregated microgrid electrical components or sensor
// data.
//
// If data is resampled, all samples that fall in a left-closed time interval
// determined by the resolution will be aggregated. At the moment only mean
// aggregation is supported. The timestamp for each aggregated sample
// represents the beginning of its corresponding time interval, marking the
// earliest point from which data was aggregated.
//
message ResamplingOptions {
  // Optional resampling resolution for the data, represented in seconds.
  // If omitted, data will be returned in its original resolution.
  optional uint32 resolution = 1;
}

// Message defining the aggregation configuration for a custom formula within
// a specific microgrid.
//
// The AggregationConfig allows clients to specify how metrics should be
// aggregated across microgrid electrical components. It serves as the
// configuration guideline for any aggregation operation.
//
// !!! example
//    To calculate the total voltage across three electrical components in
//    series with IDs 1, 2, and 3, the configuration could look like:
//
//     ```json
//     {
//       microgrid_id: 42,
//       metric: DC_VOLTAGE_V,
//       aggregation_formula: "#1 + #2 + #3"
//     }
//     ```
//
message AggregationConfig {
  // ID of the microgrid for which the formula is being specified.
  uint64 microgrid_id = 1;

  // The metric that is to be aggregated using the specified formula.
  //
  // !!! caution "Supported metrics"
  //     Ensure the chosen metric is supported by all relevant microgrid
  //     electrical components. Failure to meet these conditions might results
  //     in an aggregation error.
  frequenz.api.common.v1alpha8.metrics.Metric metric = 2;

  // The formula used for aggregating the component metric for this microgrid.
  //
  // !!! info
  //     Two types of aggregation formulas are supported:
  //     1. Aggregate functions: These are standard aggregation functions
  //        like `sum()` and `avg()`.
  //        Example: `sum(#1,#2)`, `avg(#3,#4)`
  //
  //     2. Dedicated formulas: These support basic math operators while
  //        concatenating microgrid electrical component IDs.
  //        Example: `#1 + #2 - #3`, `(#3 * #2) /# 1`
  //
  //     Additionally, metric connection identifiers can be used in the
  //     formula, for electrical components that e.g. provide the same metric
  //     from multiple connections/sensors.
  //
  //     Example:
  //     `sum(#1[connection0], #2, #3)`, `#1[connection0] + #2[connection1]`
  string aggregation_formula = 3;
}

// Defines a single aggregated metric sample, which represents a consolidated
// metric value over a collection of microgrid components within a specific
// timeframe.
//
// This message serves to encapsulate aggregate metrics derived from multiple
// component measurements. It is particularly useful in scenarios where an
// overall metric needs to be calculated for a set of components. For
// instance, you could use it to represent the average voltage across
// multiple sources within a microgrid or to calculate the average state of
// charge of several batteries.
//
message SimpleAggregatedMetricValue {
  // The UTC sample timestamp for the aggregated metrics.
  //
  // !!! info
  //     This is the original timestamp of the samples that were aggregated.
  google.protobuf.Timestamp sample_time = 1;

  // The aggregated value of the metric.
  // float value = 2;
  frequenz.api.common.v1alpha8.metrics.SimpleMetricValue sample = 2;
}

// Message defining a metric to receive data for, optionally filtering by
// connections.
//
// This message allows clients to request data for a specific metric, and
// optionally filter the data by connection identifiers. This is particularly
// useful when a metric can originate from multiple connections within a
// component, such as different DC strings for batteries or PV arrays
// connected to a hybrid inverter.
//
// !!! note
//     The `MetricConnections` message enables fine-grained control over
//     which are included in the data stream. If multiple `MetricConnections`
//     messages are specified for different metrics, the filters apply
//     separately to each metric. The `connections` specified here correspond
//     to the `connections` field in the `MetricSample` message defined in
//     the common API. By filtering on `connections`, you effectively select
//     which `MetricSample` messages to receive based on their `connections`
//     value.
//
// !!! example
//     Suppose you have a hybrid inverter that provides the `VOLTAGE` metric
//     from both its battery and PV array. If you're only interested in the
//     voltage measurements from the battery, you can use `Metrics` message
//     to specify the `VOLTAGE` metric and set `connections` to
//     `["dc_battery_1"]` for the DC string connected to a battery.
//
//     ```json
//     {
//       "metric": "VOLTAGE",
//       "connections": ["dc_battery_1"]
//     }
//     ```
//
message MetricConnections {
  // The metric for which data is requested.
  //
  // If `connections` are specified, only data for this metric from those
  // connections will be returned. If no `connections` are specified, data
  // from all connections for this metric will be returned.
  frequenz.api.common.v1alpha8.metrics.Metric metric = 1;

  // An optional list of connections to filter the data for the specified
  // metric.
  //
  // Each connection corresponds to the `connections` field in `MetricSample`
  // messages (see the common API definition). If this list is empty or not
  // specified, data from all sources for this metric will be returned.
  //
  // !!! important
  //     The connections identifiers must match exactly those used in the
  //     `MetricSample` messages. Ensure that the connections specified here
  //     are valid for the given metric and component.
  //
  // !!! important
  //     There is an important distinction between these connection strings,
  //     and the `ComponentConnection` message in the common API. A
  //     connection string here may, unlike the `ComponentConnection` message,
  //     refer to a connection that is not present in the microgrid's
  //     component graph.
  //
  // !!! example
  //     For a metric that can come from multiple DC strings in a PV array,
  //     you might specify:
  //
  //     ```json
  //     {
  //       "connections": ["dc_string_1", "dc_string_2"]
  //     }
  //     ```
  //
  repeated string connections = 2;
}

// Request message for receiving stream of metrics, such as electrical
// measurements, and other information for individual microgrid electrical
// components.
//
// !!! note
//     In addition to the raw metrics, the API can also return additional
//     information like errors or operational states of the
//     electrical components during the specified time period.
//
message ReceiveMicrogridElectricalComponentsDataStreamRequest {
  // Include options for filtering microgrid electrical components data.
  //
  // !!! note
  //     Specifies which additional fields should be included in the response.
  //
  message IncludeOptions {
    // Optional bound inclusion. By default, bounds are not included in the
    // response.
    optional FilterOption bounds = 1;

    // Optional operational state inclusion. By default, states are not
    // included in the response.
    optional FilterOption states = 2;
  }

  // General filter criteria for querying microgrid electrical components data.
  //
  // !!! note
  //     The filter criteria defined here are applied universally across all
  //     specified microgrids and their respective electrical components.
  message StreamFilter {
    // Optional resampling options like resolution for the data, represented
    // in seconds.
    // If omitted, data will be returned in its original representation.
    ResamplingOptions resampling_options = 1;

    // Include options specifying additional fields to be included in the
    // response.
    IncludeOptions include_options = 2;

    // Optional time-based filter criteria.
    // If omitted, data will start streaming from the timestamp that the
    // request was received.
    TimeFilter time_filter = 3;
  }

  // Encapsulates the microgrid ID and the component IDs within that
  // microgrid for which the historical data should be retrieved.
  //
  // !!! note
  //     Each entry in this repeated field associates a microgrid ID with its
  //     respective component IDs. At least one such association must be
  //     provided for a valid request.
  repeated frequenz.api.common.v1alpha8.microgrid.
      MicrogridElectricalComponentIDs microgrid_components = 1;

  // List of metrics to receive data for, each possibly with connection filters.
  //
  // !!! note
  //     At least one metric must be specified. Each metric can have an
  //     optional list of connections. If connections are provided for a
  //     metric, only data from those connections will be returned.
  //     If no connections are provided for a metric, data from all
  //     connections will be returned for that metric.
  //
  // !!! example
  //     To receive `VOLTAGE` data only from the battery connection and
  //     `CURRENT` data from all connections:
  //
  //     ```json
  //     {
  //       "metrics": [
  //         {
  //           "metric": "VOLTAGE",
  //           "connections": ["dc_battery_1"]
  //         },
  //         {
  //           "metric": "CURRENT"
  //           // No connections specified; data from all connections will be
  //           // returned for CURRENT
  //         }
  //       ]
  //     }
  //     ```
  repeated MetricConnections metrics = 2;

  // General filter that applies to the data retrieval for all specified
  // microgrids and electrical components.
  //
  // !!! note
  //     The filter can specify a list of metrics to be return but also
  //     specify bounds, operational state, or errors to be returned.
  StreamFilter filter = 3;
}

// Response containing a single data sample for one microgrid's
// electrical components.
//
// !!! note
//     The microgrid's electrical components are provided as single data
//     samples that encapsulate metrics, bounds, errors, and operational
//     states along with their associated timestamps. Each response message
//     covers a single microgrid. If multiple microgrids are provided in the
//     request, expect sequential messages in the stream.
//
// !!! example
//     Example output structure:
//     ```
//     {
//       microgrid_id: 1,
//       components: [
//         {
//           component_id: 13,
//           metric_samples: [
//             /* all metrics belong to the same timestamp */
//             /* sample is type MetricSampleVariant */
//             {
//               sample_time: "2023-10-01T00:00:00Z",
//               metric: "DC_VOLTAGE_V",
//               sample: {...}, bounds: {...}
//             },
//             {
//               sample_time: "2023-10-01T00:00:00Z",
//               metric: "DC_CURRENT_A",
//               sample: {...},
//               bounds: {...}
//             }
//           ],
//           state: {
//             sample_time: "2023-10-01T00:00:13.12Z",
//             states: ["COMPONENT_STATE_CHARGING", "CABLE_CONNECTED"],
//             warnings: []
//             errors: [],
//           ]
//         },
//         {
//           component_id: 59,
//           metric_samples: [
//             /* all metrics belong to the same timestamp */
//             /* sample is type MetricSampleVariant */
//             {
//               sample_time: "2023-10-01T00:00:00Z",
//               metric: "DC_VOLTAGE_V",
//               sample: {...},
//               bounds: {...}
//             },
//             {
//               sample_time: "2023-10-01T00:00:00Z",
//               metric: "DC_CURRENT_A",
//               sample: {...},
//               bounds: {...}
//             }
//           ],
//           state: {
//             sample_time: "2023-10-01T00:00:13.12Z",
//             states: ["COMPONENT_STATE_ERROR"],
//             warnings: []
//             errors: ["COMPONENT_ERROR_CODE_BATTERY_RELAY_ERROR"],
//           ]
//         }
//       ]
//     }
//     ```
//
message ReceiveMicrogridElectricalComponentsDataStreamResponse {
  // Microgrid ID for which the electrical components and samples are reported.
  uint64 microgrid_id = 1;

  // List of electrical components within this microgrid, each with its
  // associated data samples.
  repeated frequenz.api.common.v1alpha8.microgrid.electrical_components.
      ElectricalComponentTelemetry components = 2;
}

// Message defining the request format for streaming aggregated historical
// metrics.
//
// This request allows to specify custom aggregation formulas, along with
// general filtering. At least one aggregation formula config must be
// provided. The aggregation follows the passive sign convention.
//
message ReceiveAggregatedMicrogridElectricalComponentsDataStreamRequest {
  // General filter criteria for querying microgrid electrical components data.
  message AggregationStreamFilter {
    // Optional resampling options like resolution for the data, represented
    // in seconds.
    // If omitted, data will be returned in its original representation.
    ResamplingOptions resampling_options = 1;

    // Optional time-based filter criteria.
    // If omitted, data will start streaming from the timestamp that the
    // request was received.
    TimeFilter time_filter = 2;
  }

  // List of pairs of metric and corresponding aggregation formula.
  repeated AggregationConfig aggregation_configs = 1;

  // General streaming filter that applies to all formula aggregations.
  AggregationStreamFilter filter = 2;
}

// Message defining the response format for a stream that fetches aggregated
// real-time metrics for the provided custom aggregation formulas.
//
// !!! note
//     The formula and metric must have been specified in the corresponding
//     request. A single aggregated sample for the metric is returned in the
//     sample field. Each message covers a single formula. For multiple
//     formulars provided in the request, expect sequential messages in the
//     stream.
//
// !!! example
//     Given a stream output, a single sample might be:
//     ```
//     {
//       aggregation_config: {
//         microgrid_id: 1,
//         metric: "DC_VOLTAGE_V",
//         aggregation_formula: "avg(1,2,3)"
//       },
//       sample {
//         sample_time: '2023-10-01T00:00:00Z',
//         sample: { value: 42.5 }
//       }
//     }
//     ```
//
message ReceiveAggregatedMicrogridElectricalComponentsDataStreamResponse {
  // The metric and formula that has been used to aggregate the sample.
  AggregationConfig aggregation_config = 1;

  // Aggregated sample value and corresponding UTC timestamp when it was
  // sampled.
  SimpleAggregatedMetricValue sample = 2;
}

// Request message for receiving a stream of metrics, such as electrical
// measurements, and other information for individual microgrid sensors.
//
// !!! note
//     In addition to the raw metrics, the API can also return additional
//     information like errors or operational states of the sensors during
//     the specified time period.
//
message ReceiveMicrogridSensorsDataStreamRequest {
  // Include options for filtering microgrid sensors data.
  //
  // !!! note
  //     Specifies which additional fields should be included in the response.
  //
  message IncludeOptions {
    // Optional operational state inclusion. By default, states are not
    // included in the response.
    optional FilterOption states = 1;
  }

  // General filter criteria for querying microgrid sensors data.
  //
  // !!! note
  //     The filter criteria defined here are applied universally across all
  //     specified microgrids and their respective sensors.
  message StreamFilter {
    // Optional resampling options like resolution for the data, represented
    // in seconds.
    // If omitted, data will be returned in its original representation.
    ResamplingOptions resampling_options = 1;

    // Include options specifying additional fields to be included in the
    // response.
    IncludeOptions include_options = 2;

    // Optional time-based filter criteria.
    // If omitted, data will start streaming from the timestamp that the
    // request was received.
    TimeFilter time_filter = 3;
  }
  // Encapsulates the microgrid ID and the sensor IDs within that microgrid
  // for which the historical data should be retrieved.
  //
  // !!! note
  //     Each entry in this repeated field associates a microgrid ID with its
  //     respective sensor IDs. At least one such association must be
  //     provided for a valid request.
  repeated frequenz.api.common.v1alpha8.microgrid.MicrogridSensorIDs
      microgrid_sensors = 1;

  // List of metrics to receive data for, each possibly with connection filters.
  //
  // !!! note
  //     At least one metric must be specified. Each metric can have an
  //     optional list of connections. If connections are provided for a
  //     metric, only data from those connections will be returned. If no
  //     connections are provided for a metric, data from all connections
  //     will be returned for that metric.
  repeated MetricConnections metrics = 2;

  // General filter that applies to the data retrieval for all specified
  // microgrids and sensors.
  //
  // !!! note
  //     The filter can specify a list of metrics to be return but also
  //     specify bounds, operational state, or errors to be returned.
  StreamFilter filter = 3;
}

// Response containing a single data sample for one microgrid's sensors.
//
// !!! note
//     The microgrid's sensors are provided as single data samples that
//     encapsulate metrics, bounds, errors, and operational states along with
//     their associated timestamps. Each response message covers a single
//     microgrid. If multiple microgrids are provided in the request, expect
//     sequential messages in the stream.
//
message ReceiveMicrogridSensorsDataStreamResponse {
  // Microgrid ID for which the sensors and samples are reported.
  uint64 microgrid_id = 1;

  // List of sensors within this microgrid, each with its associated data
  // samples.
  repeated frequenz.api.common.v1alpha8.microgrid.sensors.SensorTelemetry
      sensors = 2;
}

// Message defining the request format for streaming aggregated historical
// metrics.
//
// This request allows to specify custom aggregation formulas, along with
// general filtering. At least one aggregation formula config must be
// provided. The aggregation follows the passive sign convention.
//
message ReceiveAggregatedMicrogridSensorsDataStreamRequest {
  // General filter criteria for querying microgrid sensors data.
  message AggregationStreamFilter {
    // Optional resampling options like resolution for the data, represented
    // in seconds.
    // If omitted, data will be returned in its original representation.
    ResamplingOptions resampling_options = 1;

    // Optional time-based filter criteria.
    // If omitted, data will start streaming from the timestamp that the
    // request was received.
    TimeFilter time_filter = 2;
  }

  // List of pairs of metric and corresponding aggregation formula.
  repeated AggregationConfig aggregation_configs = 1;

  // General streaming filter that applies to all formula aggregations.
  AggregationStreamFilter filter = 2;
}

// Message defining the response format for a stream that fetches aggregated
// real-time metrics for the provided custom aggregation formulas.
//
// !!! note
//     The formula and metric must have been specified in the corresponding
//     request. A single aggregated sample for the metric is returned in the
//     sample field. Each message covers a single formula. For multiple
//     formulars provided in the request, expect sequential
//     messages in the stream.
//
message ReceiveAggregatedMicrogridSensorsDataStreamResponse {
  // The metric and formula that has been used to aggregate the sample.
  AggregationConfig aggregation_config = 1;

  // Aggregated sample value and corresponding UTC timestamp when it was
  // sampled.
  SimpleAggregatedMetricValue sample = 2;
}
